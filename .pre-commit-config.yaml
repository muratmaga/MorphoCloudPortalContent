repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: validate-templates
        name: validate templates (required keys + placeholders)
        entry: python3 validate_templates.py
        language: system
        pass_filenames: false
        files: ^(templates/.*\.json|validate_templates\.py)$
